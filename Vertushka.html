<!DOCTYPE html>
<html lang="ru" data-theme="arbuz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вертушка</title>
<style>
:root{--stage:#06080b}
[data-theme=arbuz]{--bg:#141c16;--panel:#1a241c;--card:#223024;--ink:#e6eedd;--muted:#a3b5a0;--accent:#b5d86a;--accent-ink:#17200f;--border:#2f3f31;--track:#46584a;--cur:#b5d86a}
[data-theme=asiimov]{--bg:#f1efea;--panel:#fbfaf7;--card:#ffffff;--ink:#151515;--muted:#5d5a55;--accent:#ff6a00;--accent-ink:#151515;--border:#d6d1c7;--track:#aaa398;--cur:#b84700}
[data-theme=night]{--bg:#0d1320;--panel:#121a2b;--card:#1a2540;--ink:#e4ebf7;--muted:#9aa9c4;--accent:#4cc2ff;--accent-ink:#06121f;--border:#263453;--track:#3d4f78;--cur:#4cc2ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:grid;grid-template-rows:46px minmax(0,1fr) auto;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:currentColor;display:block}

/* верхняя полоса */
.top{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);min-width:0}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 10px;border-radius:6px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--card)}
.tab.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tab.auto{border:1px solid var(--border);margin-left:6px}
.tab.auto.on{border-color:var(--accent)}
.topr{display:flex;align-items:center;gap:10px;white-space:nowrap}
.chip{padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.dots{display:flex;gap:6px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--track)}
.dot.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--ink)}
.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.icon:hover{color:var(--ink);background:var(--card)}
.icon.on{color:var(--accent)}

/* середина */
.main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:0}
body.nolist .main{grid-template-columns:minmax(0,1fr)}
body.nolist .side{display:none}
.side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.sidehead{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--border)}
.btn{padding:8px 10px;border-radius:6px;background:var(--card);border:1px solid var(--border);text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.search{grid-column:1/-1;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:inherit;user-select:text}
.search::placeholder{color:var(--muted)}
.list{flex:1;overflow-y:auto;min-height:0;padding:4px 0}
.list::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 22px;align-items:center;gap:6px;padding:6px 6px 6px 10px;cursor:default}
.row:hover{background:var(--card)}
.row .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.row .x{opacity:0;color:var(--muted);width:22px;height:22px;border-radius:4px;font-size:16px;line-height:1}
.row:hover .x{opacity:1}
.row .x:hover{color:var(--ink);background:var(--border)}
.row.cur{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
.row.cur .t{color:var(--cur);font-weight:600}
.row.bad .t{text-decoration:line-through;color:var(--muted)}
.sidefoot{padding:8px 10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.link{color:var(--muted);text-decoration:underline}
.link:hover{color:var(--ink)}
.empty{padding:22px 16px;color:var(--muted);line-height:1.5}

.stage{position:relative;background:var(--stage);min-width:0;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.osd{position:absolute;left:28px;bottom:26px;right:28px;color:#fff;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 1px 12px #000,0 0 2px #000}
.osd.show{opacity:1}
.osd b{display:block;font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osd span{font-size:15px;opacity:.85}
.vizname{position:absolute;top:16px;left:20px;color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 1px 8px #000}
.vizname.show{opacity:.85}
.welcome{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.welcome>div{pointer-events:auto;text-align:center;color:#e9eef2;max-width:480px;padding:28px 30px;background:rgba(10,13,17,.9);border:1px solid rgba(255,255,255,.14);border-radius:12px}
.welcome h1{margin:0 0 8px;font-size:28px;font-weight:600}
.welcome p{margin:0 0 18px;color:#c3ccd4;line-height:1.5}
.welcome .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.welcome .btn{background:#232a31;border-color:#56616c;color:#fff;padding:10px 16px}
.welcome .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;background:rgba(0,0,0,.6);color:#fff;display:none;place-items:center;font-size:22px;pointer-events:none}
body.dragging .drop{display:grid}

/* нижняя панель */
.bar{background:var(--panel);border-top:1px solid var(--border);padding:8px 14px 10px}
.seek{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.seek span:last-child{text-align:right}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;margin-top:4px}
.now{display:flex;align-items:center;gap:10px;min-width:0}
.cover{width:44px;height:44px;border-radius:6px;background:var(--card) center/cover no-repeat;border:1px solid var(--border);flex:none;display:grid;place-items:center;color:var(--muted)}
.cover.has svg{display:none}
.meta{min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.meta span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{display:flex;align-items:center;gap:6px}
.play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 6px}
.play:hover{filter:brightness(1.08)}
.play svg{width:26px;height:26px}
.mid .icon{width:36px;height:36px;color:var(--ink);position:relative}
.mid .icon.tog{color:var(--muted)}
.mid .icon.tog.on{color:var(--accent)}
.badge{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:700;color:var(--accent)}
.right{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.right input{width:110px}
.right .icon{color:var(--ink);width:36px;height:36px}
.stopb{margin-right:8px}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:pointer;--f:0;--p:calc(6px + (100% - 12px)*var(--f));margin:0;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:-4px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1px solid var(--border);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:80vw}
.toast.show{opacity:1}

/* на весь экран */
body.immersive{grid-template-rows:0 minmax(0,1fr) 0}
body.immersive .top,body.immersive .side{display:none}
body.immersive .main{grid-template-columns:minmax(0,1fr)}
body.immersive .bar{position:fixed;left:0;right:0;bottom:0;transition:opacity .4s;z-index:5}
body.immersive.idle .bar{opacity:0;pointer-events:none}
body.immersive.idle{cursor:none}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}.side{display:none}.right input{width:70px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Верт<i>у</i>шка</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="topr">
    <button class="chip" id="palBtn" title="Цвета визуализации (C)">Цвет: тема</button>
    <div class="dots" id="themes" title="Оформление"></div>
    <button class="icon" id="listBtn" title="Список треков (L)"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg></button>
    <button class="icon" id="fsBtn" title="На весь экран (F)"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  </div>
</header>

<div class="main">
  <aside class="side">
    <div class="sidehead">
      <button class="btn pri" id="addFolder">+ Папка</button>
      <button class="btn" id="addFiles">+ Файлы</button>
      <input class="search" id="search" placeholder="Поиск по списку" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
    <div class="sidefoot"><span id="count">0 треков</span><button class="link" id="clear">очистить</button></div>
  </aside>
  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="vizname" id="vizname"></div>
    <div class="osd" id="osd"><b></b><span></span></div>
    <div class="welcome" id="welcome"><div>
      <h1>Закинь сюда музыку</h1>
      <p>Перетащи файлы или папку прямо в окно, либо выбери кнопкой. Ничего никуда не загружается, всё играет с ноутбука.</p>
      <div class="acts">
        <button class="btn pri" id="wFolder">Выбрать папку</button>
        <button class="btn" id="wFiles">Выбрать файлы</button>
        <button class="btn" id="wLast" hidden></button>
      </div>
    </div></div>
    <div class="drop">Отпускай, добавлю в список</div>
  </section>
</div>

<footer class="bar">
  <div class="seek"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="tDur">0:00</span></div>
  <div class="ctl">
    <div class="now">
      <div class="cover" id="cover"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg></div>
      <div class="meta"><b id="nTitle">Ничего не играет</b><span id="nArtist">Добавь треки в список</span></div>
    </div>
    <div class="mid">
      <button class="icon tog" id="shuf" title="Вперемешку (S)"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="icon" id="prev" title="Предыдущий (P)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button class="play" id="play" title="Играть / пауза (пробел)"><svg viewBox="0 0 24 24"><path id="playPath" d="M8 5v14l11-7z"/></svg></button>
      <button class="icon" id="next" title="Следующий (N)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="icon tog" id="rep" title="Повтор (R)"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span class="badge" id="repBadge"></span></button>
    </div>
    <div class="right">
      <button class="icon stopb" id="stop" title="Стоп"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button class="icon" id="mute" title="Звук (M)"><svg viewBox="0 0 24 24"><path id="volPath" d=""/></svg></button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость">
    </div>
  </div>
</footer>
<div class="toast" id="toast"></div>
<input type="file" id="inFiles" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.webm,.weba" multiple hidden>
<input type="file" id="inDir" webkitdirectory multiple hidden>

<script>
'use strict';
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('vt_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('vt_'+k,JSON.stringify(v))}catch(e){}}};
const EXT=/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm|weba)$/i;
const fmt=s=>{if(!isFinite(s)||s<0)return '0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}

/* ---------- звук ---------- */
const audio=new Audio();audio.preload='auto';
let actx=null,analyser=null;
const FFT=4096;
let freq=new Uint8Array(FFT/2),wave=new Uint8Array(FFT);
const NB=64;let bLo=new Int32Array(NB),bHi=new Int32Array(NB);
function calcBins(sr){for(let b=0;b<NB;b++){const f0=35*Math.pow(16000/35,b/NB),f1=35*Math.pow(16000/35,(b+1)/NB);const lo=Math.floor(f0/(sr/2)*(FFT/2)),hi=Math.ceil(f1/(sr/2)*(FFT/2));bLo[b]=Math.min(FFT/2-1,Math.max(1,lo));bHi[b]=Math.min(FFT/2,Math.max(bLo[b]+1,hi))}}
calcBins(48000);
function initAudio(){if(actx)return;actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaElementSource(audio);analyser=actx.createAnalyser();analyser.fftSize=FFT;analyser.smoothingTimeConstant=0.72;src.connect(analyser);analyser.connect(actx.destination);calcBins(actx.sampleRate)}
const A={bands:new Float32Array(NB),bass:0,mid:0,tre:0,level:0,beat:0,live:false};
let bassAvg=0,lastBeat=0;
function analyse(t,dt){
  const live=!!analyser&&!audio.paused;A.live=live;
  if(live){analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(wave)}
  else{for(let i=0;i<freq.length;i++){const f=i/freq.length;freq[i]=Math.max(0,84*Math.pow(1-f,3)*(0.55+0.45*Math.sin(t*1.1+i*0.045))+16*Math.sin(t*0.6+i*0.19))}
       for(let i=0;i<wave.length;i++)wave[i]=128+20*Math.sin(i*0.012+t*1.8)*Math.sin(t*0.45)+7*Math.sin(i*0.05-t*2.6)}
  let sb=0,sm=0,st=0;
  for(let b=0;b<NB;b++){let s=0;for(let i=bLo[b];i<bHi[b];i++)s+=freq[i];let v=s/((bHi[b]-bLo[b])*255);v=Math.pow(v,1.35)*(1+b/NB*0.8);if(v>1)v=1;A.bands[b]=v;if(b<8)sb+=v;else if(b<36)sm+=v;else st+=v}
  A.bass=sb/8;A.mid=sm/28;A.tre=st/28;
  let e=0;for(let i=0;i<wave.length;i+=4){const d=wave[i]-128;e+=d*d}
  A.level=Math.min(1,Math.sqrt(e/(wave.length/4))/128*2.2);
  bassAvg+=(A.bass-bassAvg)*0.05;
  if(live&&A.bass>bassAvg*1.3&&A.bass>0.3&&t-lastBeat>0.2){A.beat=1;lastBeat=t}
  A.beat*=Math.exp(-dt*5);
}

/* ---------- палитры ---------- */
const BG='#06080b',BGR='6,8,11';
const THEME_PAL={arbuz:[[26,84,44],[122,200,72],[214,240,128],[255,96,128]],asiimov:[[70,70,70],[255,106,0],[255,176,64],[255,255,255]],night:[[36,70,214],[44,190,255],[150,112,255],[255,124,220]]};
const PALS=[{id:'theme',name:'тема'},{id:'rainbow',name:'радуга'},{id:'fire',name:'огонь',s:[[110,8,0],[234,48,0],[255,164,0],[255,242,176]]},{id:'ice',name:'лёд',s:[[18,58,130],[0,150,208],[120,230,240],[240,255,255]]}];
let palIdx=0,theme='arbuz';
const PR=new Uint8Array(256),PG=new Uint8Array(256),PB=new Uint8Array(256),PS=new Array(256);
function hsl2rgb(h,s,l){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return [f(0)*255,f(8)*255,f(4)*255]}
function buildPal(){const p=PALS[palIdx];const st=p.id==='theme'?THEME_PAL[theme]:p.s;
  for(let i=0;i<256;i++){let c;const t=i/255;if(p.id==='rainbow')c=hsl2rgb((0.62+t*0.85)%1,0.9,0.56);else{const x=t*(st.length-1),k=Math.min(st.length-2,Math.floor(x)),f=x-k;c=[0,1,2].map(j=>st[k][j]+(st[k+1][j]-st[k][j])*f)}
    PR[i]=c[0];PG[i]=c[1];PB[i]=c[2];PS[i]='rgb('+PR[i]+','+PG[i]+','+PB[i]+')'}}
const ci=t=>t<=0?0:t>=1?255:(t*255)|0;
const col=t=>PS[ci(t)];
const cola=(t,a)=>{const i=ci(t);return 'rgba('+PR[i]+','+PG[i]+','+PB[i]+','+a+')'};
const tri=t=>{t=t-Math.floor(t);return 1-Math.abs(2*t-1)};   // 0..1..0 по кругу

/* ---------- визуализации ---------- */
const cv=$('#cv'),g=cv.getContext('2d');let W=10,H=10,dpr=1,S={};
let coverImg=null;
const VIZ=[
{name:'Столбики',draw(w,h,t,dt){
  g.fillStyle=BG;g.fillRect(0,0,w,h);
  const n=56,base=h*0.74,maxH=h*0.62,gap=Math.max(2,w*0.004),x0=w*0.05,bw=(w*0.9-gap*(n-1))/n;
  S.v=S.v||new Float32Array(n);S.p=S.p||new Float32Array(n);
  const gr=g.createLinearGradient(0,base-maxH,0,base);gr.addColorStop(0,col(1));gr.addColorStop(0.35,col(0.7));gr.addColorStop(0.7,col(0.4));gr.addColorStop(1,col(0.12));
  for(let i=0;i<n;i++){const tv=A.bands[(i*NB/n)|0];S.v[i]=tv>S.v[i]?tv:Math.max(tv,S.v[i]-dt*1.6);S.p[i]=S.v[i]>=S.p[i]?S.v[i]:Math.max(0,S.p[i]-dt*0.3);
    const bh=Math.max(2,S.v[i]*maxH),x=x0+i*(bw+gap);
    g.fillStyle=gr;g.fillRect(x,base-bh,bw,bh);
    g.globalAlpha=0.22;g.fillRect(x,base+4,bw,bh*0.42);g.globalAlpha=1;
    g.fillStyle='#fff';g.fillRect(x,base-S.p[i]*maxH-5,bw,2)}
  const fd=g.createLinearGradient(0,base+4,0,base+4+maxH*0.42);fd.addColorStop(0,'rgba('+BGR+',0)');fd.addColorStop(1,BG);g.fillStyle=fd;g.fillRect(0,base+4,w,maxH*0.45);
}},
{name:'Волна',draw(w,h,t,dt){

      if(q<en)o.cover=URL.createObjectURL(new Blob([b.slice(q,en)],{type:m.includes('/')?m:'image/jpeg'}))}
    p=en}

function paintTime(){const d=audio.duration,c=audio.currentTime||0;$('#tCur').textContent=fmt(c);$('#tDur').textContent=fmt(isFinite(d)?d:(tracks[cur]?tracks[cur].dur:0));
  if(!dragging){const p=isFinite(d)&&d>0?c/d*1000:0;seekEl.value=p;setV(seekEl,p/10)}}
audio.addEventListener('timeupdate',paintTime);
audio.addEventListener('loadedmetadata',()=>{const t=tracks[cur];if(t&&!isFinite(t.dur)){t.dur=audio.duration;paintRow(t)}paintTime()});
audio.addEventListener('play',()=>{$('#playPath').setAttribute('d',PAUSE);errRun=0});
audio.addEventListener('pause',()=>$('#playPath').setAttribute('d',PLAY));
audio.addEventListener('ended',()=>{if(repeat==='one'){audio.currentTime=0;audio.play().catch(()=>{})}else next(true)});
audio.addEventListener('error',()=>{const t=tracks[cur];if(!t||!audio.getAttribute('src'))return;t.bad=true;paintRow(t);errRun++;toast('Не получилось открыть: '+t.file.name);if(errRun<Math.min(5,tracks.length))next(true)});
seekEl.addEventListener('pointerdown',()=>dragging=true);
seekEl.addEventListener('input',()=>{setV(seekEl,seekEl.value/10);if(isFinite(audio.duration))$('#tCur').textContent=fmt(seekEl.value/1000*audio.duration)});
seekEl.addEventListener('change',()=>{if(isFinite(audio.duration))audio.currentTime=seekEl.value/1000*audio.duration;dragging=false});
function setVol(v,keepMute){v=Math.max(0,Math.min(100,Math.round(v)));if(!keepMute)audio.muted=false;audio.volume=v/100;volEl.value=v;setV(volEl,audio.muted?0:v);$('#volPath').setAttribute('d',audio.muted||v===0?MUTE:VOL);LS.set('vol',v)}
volEl.addEventListener('input',()=>setVol(+volEl.value));
$('#mute').onclick=()=>{audio.muted=!audio.muted;setVol(+volEl.value,true)};
function paintModes(){$('#shuf').classList.toggle('on',shuffle);$('#rep').classList.toggle('on',repeat!=='off');$('#repBadge').textContent=repeat==='one'?'1':'';$('#rep').title='Повтор: '+({off:'выключен',all:'весь список',one:'один трек'})[repeat]+' (R)'}
$('#shuf').onclick=()=>{shuffle=!shuffle;hist=[];LS.set('shuffle',shuffle);paintModes();toast(shuffle?'Вперемешку':'По порядку')};
$('#rep').onclick=()=>{repeat=repeat==='off'?'all':repeat==='all'?'one':'off';LS.set('repeat',repeat);paintModes();toast($('#rep').title.replace(' (R)',''))};
$('#play').onclick=toggle;$('#next').onclick=()=>next(false);$('#prev').onclick=prev;$('#stop').onclick=()=>stopAll();
$('#clear').onclick=clearAll;$('#search').addEventListener('input',applyFilter);
if('mediaSession' in navigator){const ms=navigator.mediaSession,h=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};h('play',toggle);h('pause',toggle);h('nexttrack',()=>next(false));h('previoustrack',prev);h('stop',()=>stopAll())}

/* ---------- добавление музыки ---------- */
const idb={open(){return new Promise((res,rej)=>{const r=indexedDB.open('vertushka',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){}},
  async set(k,v){try{const db=await this.open();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}};
async function scanHandle(dir,out,path){for await(const [name,h] of dir.entries()){if(h.kind==='file'){if(EXT.test(name)){try{const f=await h.getFile();f._path=path+name;out.push(f)}catch(e){}}}else await scanHandle(h,out,path+name+'/')}}
async function openHandle(h){toast('Читаю папку…');const out=[];await scanHandle(h,out,h.name+'/');addFiles(out)}
async function pickFolder(){if(window.showDirectoryPicker){try{const h=await showDirectoryPicker({id:'music',startIn:'music'});await idb.set('dir',h);await openHandle(h);return}catch(e){if(e.name==='AbortError')return}}$('#inDir').click()}
function pickFiles(){$('#inFiles').click()}
$('#inFiles').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#inDir').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#addFolder').onclick=$('#wFolder').onclick=pickFolder;$('#addFiles').onclick=$('#wFiles').onclick=pickFiles;
idb.get('dir').then(h=>{if(!h)return;const b=$('#wLast');b.hidden=false;b.textContent='Открыть прошлую: '+h.name;b.onclick=async()=>{try{if(await h.requestPermission({mode:'read'})==='granted')await openHandle(h);else toast('Нет доступа к папке')}catch(e){toast('Папка недоступна, выбери заново')}}});
function walkEntry(en,out,path){return new Promise(res=>{if(en.isFile)en.file(f=>{f._path=path+f.name;out.push(f);res()},()=>res());
  else if(en.isDirectory){const rd=en.createReader();const all=[];const more=()=>rd.readEntries(async list=>{if(!list.length){for(const x of all)await walkEntry(x,out,path+en.name+'/');res()}else{all.push(...list);more()}},()=>res());more()}else res()})}
let dragN=0;
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragN++;document.body.classList.add('dragging')}});
addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)document.body.classList.remove('dragging')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();dragN=0;document.body.classList.remove('dragging');const dt=e.dataTransfer;if(!dt)return;
  const plain=[...dt.files],ents=[...dt.items].filter(i=>i.kind==='file').map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null),out=[];
  for(let k=0;k<ents.length;k++){const en=ents[k];if(en&&en.isDirectory)await walkEntry(en,out,'');else if(plain[k])out.push(plain[k])}
  if(!ents.length)out.push(...plain);addFiles(out)});

/* ---------- оформление, экран, клавиши ---------- */
const THEMES=[['arbuz','Арбуз','#b5d86a'],['asiimov','Азимов','#ff6a00'],['night','Ночь','#4cc2ff']];
function setTheme(id){theme=THEMES.some(t=>t[0]===id)?id:'arbuz';document.documentElement.dataset.theme=theme;document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.id===theme));LS.set('theme',theme);buildPal()}
function setPal(i){palIdx=((i%PALS.length)+PALS.length)%PALS.length;$('#palBtn').textContent='Цвет: '+PALS[palIdx].name;LS.set('pal',palIdx);buildPal()}
THEMES.forEach(([id,name,c])=>{const b=document.createElement('button');b.className='dot';b.dataset.id=id;b.title=name;b.style.background=c;b.onclick=()=>setTheme(id);$('#themes').appendChild(b)});
VIZ.forEach((v,i)=>{const b=document.createElement('button');b.className='tab';b.dataset.i=i;b.textContent=v.name;b.title='Клавиша '+(i+1);b.onclick=()=>{setViz(i);if(auto)setAuto(false)};$('#tabs').appendChild(b)});
{const b=document.createElement('button');b.className='tab auto';b.id='autoTab';b.textContent='Авто';b.title='Менять визуализацию каждые 25 секунд (A)';b.onclick=()=>setAuto(!auto);$('#tabs').appendChild(b)}
$('#palBtn').onclick=()=>setPal(palIdx+1);
function setList(v){document.body.classList.toggle('nolist',!v);$('#listBtn').classList.toggle('on',v);LS.set('list',v)}
$('#listBtn').onclick=()=>setList(document.body.classList.contains('nolist'));
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Полный экран недоступен'))}
$('#fsBtn').onclick=toggleFs;$('#stage').addEventListener('dblclick',e=>{if(!e.target.closest('button'))toggleFs()});
let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);if(document.fullscreenElement)idleT=setTimeout(()=>document.body.classList.add('idle'),2500)};
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('immersive',!!document.fullscreenElement);wake()});
addEventListener('mousemove',wake);addEventListener('keydown',wake);
addEventListener('keydown',e=>{if(e.target.id==='search'){if(e.key==='Escape'){e.target.value='';applyFilter();e.target.blur()}return}
  if(e.ctrlKey||e.altKey||e.metaKey)return;const c=e.code;let ok=true;
  if(c==='Space')toggle();else if(c==='ArrowRight'){if(isFinite(audio.duration))audio.currentTime=Math.min(audio.duration-0.2,audio.currentTime+(e.shiftKey?30:5))}
  else if(c==='ArrowLeft')audio.currentTime=Math.max(0,audio.currentTime-(e.shiftKey?30:5));
  else if(c==='ArrowUp')setVol(+volEl.value+5);else if(c==='ArrowDown')setVol(+volEl.value-5);
  else if(c==='KeyN')next(false);else if(c==='KeyP')prev();else if(c==='KeyM')$('#mute').click();else if(c==='KeyF')toggleFs();
  else if(c==='KeyV'){setViz(vizIdx+(e.shiftKey?-1:1));if(auto)setAuto(false)}else if(c==='KeyA')setAuto(!auto);else if(c==='KeyC')setPal(palIdx+1);
  else if(c==='KeyL')$('#listBtn').click();else if(c==='KeyS')$('#shuf').click();else if(c==='KeyR')$('#rep').click();
  else if(/^Digit[1-9]$/.test(c)&&+c[5]<=VIZ.length){setViz(+c[5]-1);if(auto)setAuto(false)}else ok=false;
  if(ok){e.preventDefault();if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur()}});

/* ---------- запуск ---------- */
setTheme(LS.get('theme','arbuz'));setPal(LS.get('pal',0));setList(LS.get('list',true));setVol(LS.get('vol',80));paintModes();
resize();setViz(LS.get('viz',0),true);setAuto(LS.get('auto',false));renum();showNow();requestAnimationFrame(frame);
window.__vt={get tracks(){return tracks},get cur(){return cur},A,audio,get frames(){return frames},setViz,setTheme,setPal,VIZ,addFiles,get actx(){return actx}};
</script>
